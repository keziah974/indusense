[project]
name = "indusense"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "pandas>=2.3.3",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
    "sqlglot>=30.33.0",
]

[project.scripts]
indusense = "indusense:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
